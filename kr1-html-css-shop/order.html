<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Заявка — Винтаж-лавка</title>
    <meta
      name="description"
      content="Форма заявки Винтаж-лавки: укажите имя, e-mail, телефон, товар и сообщение."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-header__logo" href="index.html">Винтаж-лавка</a>
        <nav class="site-nav" aria-label="Основное меню">
          <ul class="site-nav__list">
            <li class="site-nav__item">
              <a class="site-nav__link" href="index.html">Главная</a>
            </li>
            <li class="site-nav__item">
              <a class="site-nav__link" href="catalog.html">Каталог</a>
            </li>
            <li class="site-nav__item">
              <a class="site-nav__link" href="contacts.html">Контакты</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <h1>Заявка</h1>
          <form class="order-form" action="order.html" method="get">
            <div class="order-form__field">
              <label class="order-form__label" for="name">Имя</label>
              <input
                class="order-form__input"
                id="name"
                name="name"
                type="text"
                autocomplete="name"
                required
              />
            </div>
            <div class="order-form__field">
              <label class="order-form__label" for="email">Email</label>
              <input
                class="order-form__input"
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="order-form__field">
              <label class="order-form__label" for="phone">Телефон</label>
              <input
                class="order-form__input"
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                required
              />
            </div>
            <div class="order-form__field">
              <label class="order-form__label" for="product">Товар</label>
              <select
                class="order-form__input"
                id="product"
                name="product"
                required
              >
                <option value="">Выберите товар</option>
                <option value="1">Плёночная камера</option>
                <option value="2">Блокнот в обложке</option>
                <option value="3">Набор инструментов</option>
              </select>
            </div>
            <div class="order-form__field">
              <label class="order-form__label" for="message">Сообщение</label>
              <textarea
                class="order-form__input"
                id="message"
                name="message"
                rows="4"
              ></textarea>
            </div>
            <div class="order-form__field order-form__field--check">
              <input id="agree" name="agree" type="checkbox" required />
              <label for="agree">Согласен на обработку данных</label>
            </div>
            <div class="order-form__actions">
              <button class="button" type="submit">Отправить</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <section class="site-footer__about" id="about">
          <h2 class="site-footer__title">О нас</h2>
          <p class="site-footer__text">
            Винтаж-лавка — небольшой магазин старинных и винтажных вещей:
            камеры, инструменты, канцелярия и предметы интерьера.
          </p>
        </section>
        <p class="site-footer__copy">2026 Винтаж-лавка. Учебный проект</p>
      </div>
    </footer>
  </body>
</html>
